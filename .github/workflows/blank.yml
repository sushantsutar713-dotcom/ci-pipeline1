
name: Agile DevOps CI-CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Website
        run: test -f index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test HTML
        run: |
          python -c "from html.parser import HTMLParser; from pathlib import Path; HTMLParser().feed(Path('index.html').read_text()); print('HTML test passed')"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML
        run: |
          grep -qi '<!doctype html>' index.html
          echo "Code quality check passed"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, unit-test, code-quality]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
