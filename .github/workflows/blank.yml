
name: Agile DevOps CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Project
        run: echo "Build successful"

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          echo "Running unit tests"
          test 1 -eq 1
          echo "Unit tests passed"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Code Quality
        run: |
          git diff --check
          echo "Code quality check passed"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
      - unit-test
      - code-quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deployment Demo
        run: echo "Deployment stage completed successfully"
